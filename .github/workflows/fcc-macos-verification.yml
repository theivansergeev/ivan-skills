name: FCC clean macOS verification
on:
  push:
    branches: [verify/fcc-windows-20261030]
    paths: [.github/workflows/fcc-macos-verification.yml, verification/macos-e2e.py]
permissions:
  contents: read
jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 verification/macos-e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-native-macos-evidence
          path: /private/tmp/FCCMacEvidence/*
          retention-days: 7
